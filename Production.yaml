# RC4 parity-first full standalone output; no Overrides with this profile.
mode: rule
log-level: info
dns:
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - +.miwifi.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.servicewechat.com
  - +.wxs.qq.com
  - +.weixin.qq.com
  - +.feishu.cn
  - +.meituan.net
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
proxy-providers:
  GLaDOS:
    url: https://example.invalid/REPLACE_WITH_PRIVATE_GLADOS_CLASH_YAML_URL
    path: ./providers/hj-glados.yaml
    interval: 43200
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5
proxy-groups:
- name: 🌐 通用代理
  type: select
  proxies:
  - ⚡ 自動選優
  - 🇺🇸 美國・故障備援
  - 🇹🇼 台灣・故障備援
  - 🇯🇵 日本・故障備援
  - 🇺🇸 美國・手動固定
  - 🇹🇼 台灣・手動固定
  - 🇯🇵 日本・手動固定
  - 🧰 全部節點（含 X5）
  - DIRECT
- name: ⚡ 自動選優
  type: url-test
  use:
  - GLaDOS
  filter: ^((Fast|Balancer)-B[0-9]+|(US|TW|JP)-X1)-[0-9]+$
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: 🇺🇸 美國・手動固定
  type: select
  use:
  - GLaDOS
  filter: ^US-Fixed-[0-9]+$
- name: 🇹🇼 台灣・手動固定
  type: select
  use:
  - GLaDOS
  filter: ^TW-Fixed-[0-9]+$
- name: 🇯🇵 日本・手動固定
  type: select
  use:
  - GLaDOS
  filter: ^JP-Fixed-[0-9]+$
- name: 🇺🇸 美國・故障備援
  type: fallback
  use:
  - GLaDOS
  filter: ^US-Fixed-[0-9]+$
  url: http://www.gstatic.com/generate_204
  interval: 180
  lazy: true
- name: 🇹🇼 台灣・故障備援
  type: fallback
  use:
  - GLaDOS
  filter: ^TW-Fixed-[0-9]+$
  url: http://www.gstatic.com/generate_204
  interval: 180
  lazy: true
- name: 🇯🇵 日本・故障備援
  type: fallback
  use:
  - GLaDOS
  filter: ^JP-Fixed-[0-9]+$
  url: http://www.gstatic.com/generate_204
  interval: 180
  lazy: true
- name: 🤖 AI 服務
  type: select
  proxies:
  - 🇺🇸 美國・故障備援
  - 🇺🇸 美國・手動固定
  - 🇯🇵 日本・故障備援
  - 🇹🇼 台灣・故障備援
  - 🇯🇵 日本・手動固定
  - 🇹🇼 台灣・手動固定
  - ⚡ 自動選優
- name: 🍎 Apple 智慧
  type: select
  proxies:
  - 🇺🇸 美國・故障備援
  - 🇺🇸 美國・手動固定
  - 🇯🇵 日本・故障備援
  - 🇹🇼 台灣・故障備援
  - 🇯🇵 日本・手動固定
  - 🇹🇼 台灣・手動固定
- name: 🔔 Apple 推送
  type: select
  proxies:
  - 🇹🇼 台灣・手動固定
  - 🇺🇸 美國・手動固定
  - 🇯🇵 日本・手動固定
  - 🇹🇼 台灣・故障備援
  - 🇺🇸 美國・故障備援
  - 🇯🇵 日本・故障備援
- name: 🛡️ 廣告攔截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🧰 全部節點（含 X5）
  type: select
  use:
  - GLaDOS
