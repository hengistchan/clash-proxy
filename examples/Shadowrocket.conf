# Example only. The node address is a documentation placeholder.
[General]
ipv6 = false
dns-server = 1.1.1.1
skip-proxy = localhost

[Proxy]
Example node = socks5, 192.0.2.10, 1080

[Proxy Group]
Outlet = select, Example node, DIRECT, policy-select-name=Example node

[Rule]
DOMAIN-SUFFIX,example.org,Outlet
DOMAIN-SET,https://example.org/domains.list,REJECT
FINAL,DIRECT

[Host]
test.example.org = 192.0.2.1
