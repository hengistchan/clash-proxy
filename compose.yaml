name: stash-config-forge

services:
  api:
    build:
      context: .
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      STASH_DB_PATH: /data/stash-config.sqlite3
      STASH_KEY_PATH: /data/stash-config.sqlite3.key
      STASH_ADMIN_TOKEN: "${STASH_ADMIN_TOKEN:-}"
      STASH_PUBLIC_BASE_URL: "${STASH_PUBLIC_BASE_URL:-}"
      STASH_SECRET_KEY: "${STASH_SECRET_KEY:-}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,mode=0755,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - stash-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  stash-data:
