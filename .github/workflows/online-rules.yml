name: Online Rule Check

on:
  schedule:
    # 01:17 UTC = 09:17 Asia/Shanghai
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-rule-check
  cancel-in-progress: true

jobs:
  check-remote-rules:
    name: Check upstream rule providers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check live rule providers
        run: python Tests/live_remote_check.py

      - name: Upload sanitized live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-remote-report-${{ github.run_id }}
          path: Tests/live-remote-report.json
          if-no-files-found: warn
          retention-days: 30
