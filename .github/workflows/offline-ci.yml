name: Offline CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-service:
    name: Validate Node.js service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Mihomo validation core
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-compatible-v1.19.33.gz \
            --output mihomo.gz
          echo '386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6  mihomo.gz' | sha256sum --check
          gzip -d mihomo.gz
          chmod 755 mihomo

      - name: Typecheck and run service tests
        env:
          MIHOMO_TEST_BIN: ${{ runner.temp }}/mihomo
        run: npm run check

      - name: Build production bundle
        run: npm run build

  browser:
    name: Validate production browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Run isolated browser regressions
        run: npm run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
