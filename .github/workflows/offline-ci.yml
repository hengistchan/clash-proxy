name: Offline CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-service:
    name: Validate Node.js service
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and run service tests
        run: npm run check

      - name: Build production bundle
        run: npm run build

  browser:
    name: Validate production browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Run isolated browser regressions
        run: npm run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
